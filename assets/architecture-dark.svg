<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 326" width="100%" height="100%" role="img" aria-label="Áreas de Atuação: Desenvolvimento Full-Stack, DevOps &amp; Containers, Práticas de DevSecOps">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D0D10"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes barPulse1 { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes barPulse2 { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .p1 { animation: barPulse1 2.2s ease-in-out infinite; }
    .p2 { animation: barPulse2 2.2s ease-in-out infinite; }
  </style>

  <!-- ==================== CARD 01: DESENVOLVIMENTO FULL-STACK ==================== -->
  <g transform="translate(4, 6)">
    <rect x="0" y="0" width="384" height="314" rx="14" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <rect x="28" y="0" width="52" height="2" fill="#FFFFFF"/>

    <rect x="28" y="24" width="46" height="22" rx="4" fill="#FFFFFF"/>
    <text x="51" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#09090B">01</text>
    <text x="356" y="39" text-anchor="end" class="mono" font-size="10.5" fill="#71717A" letter-spacing="1.4">FULL-STACK · APIS</text>

    <text x="28" y="78" class="sans" font-size="20" font-weight="700" fill="#FAFAFA">Desenvolvimento</text>
    <line x1="28" y1="96" x2="356" y2="96" stroke="#27272A" stroke-width="1"/>

    <text x="28" y="126" class="sans" font-size="13" fill="#D4D4D8">▸ Interfaces Web com React, TypeScript &amp; Vue.js</text>
    <text x="28" y="156" class="sans" font-size="13" fill="#D4D4D8">▸ APIs &amp; Serviços em Node.js, Python e C# (.NET)</text>
    <text x="28" y="186" class="sans" font-size="13" fill="#A1A1AA">▸ Automação de Fluxos, CLI &amp; Integrações REST</text>
    <text x="28" y="216" class="sans" font-size="13" fill="#A1A1AA">▸ Dados com PostgreSQL, Prisma, SQLite &amp; Redis</text>

    <rect x="24" y="248" width="336" height="42" rx="8" fill="#121216" stroke="#27272A" stroke-width="1"/>
    <circle class="p1" cx="42" cy="269" r="4" fill="#FFFFFF"/>
    <text x="54" y="273" class="mono" font-size="10.5" fill="#A1A1AA" letter-spacing="0.8">STACK :: END-TO-END</text>
    <text x="344" y="273" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">PRIMARY</text>
  </g>

  <!-- ==================== CARD 02: DEVOPS & INFRAESTRUTURA ==================== -->
  <g transform="translate(408, 6)">
    <rect x="0" y="0" width="384" height="314" rx="14" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <rect x="28" y="0" width="52" height="2" fill="#FFFFFF"/>

    <rect x="28" y="24" width="46" height="22" rx="4" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <text x="51" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">02</text>
    <text x="356" y="39" text-anchor="end" class="mono" font-size="10.5" fill="#71717A" letter-spacing="1.4">CONTAINERS · CLOUD</text>

    <text x="28" y="78" class="sans" font-size="20" font-weight="700" fill="#FAFAFA">DevOps &amp; Entrega</text>
    <line x1="28" y1="96" x2="356" y2="96" stroke="#27272A" stroke-width="1"/>

    <text x="28" y="126" class="sans" font-size="13" fill="#D4D4D8">▸ Containerização com Docker, Compose &amp; Nginx</text>
    <text x="28" y="156" class="sans" font-size="13" fill="#D4D4D8">▸ Kubernetes (K3s / EKS), HPA &amp; Health Probes</text>
    <text x="28" y="186" class="sans" font-size="13" fill="#A1A1AA">▸ IaC com Terraform (AWS) &amp; Deploys Cloud Run</text>
    <text x="28" y="216" class="sans" font-size="13" fill="#A1A1AA">▸ CI/CD GitHub Actions &amp; Scripts PowerShell/Bash</text>

    <rect x="24" y="248" width="336" height="42" rx="8" fill="#121216" stroke="#27272A" stroke-width="1"/>
    <text x="40" y="273" class="mono" font-size="10.5" fill="#A1A1AA" letter-spacing="0.8">REPLICAS</text>
    <g transform="translate(116, 261)">
      <rect x="0"  y="0" width="8" height="16" rx="1.5" fill="#FFFFFF"/>
      <rect x="12" y="0" width="8" height="16" rx="1.5" fill="#FFFFFF"/>
      <rect class="p1" x="24" y="0" width="8" height="16" rx="1.5" fill="#D4D4D8"/>
      <rect class="p2" x="36" y="0" width="8" height="16" rx="1.5" fill="#71717A"/>
      <rect x="48" y="0" width="8" height="16" rx="1.5" fill="#27272A"/>
    </g>
    <text x="344" y="273" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">CI/CD · K8S</text>
  </g>

  <!-- ==================== CARD 03: PRÁTICAS DE DEVSECOPS ==================== -->
  <g transform="translate(812, 6)">
    <rect x="0" y="0" width="384" height="314" rx="14" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1.4"/>
    <rect x="28" y="0" width="52" height="2" fill="#FFFFFF"/>

    <rect x="28" y="24" width="46" height="22" rx="4" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    <text x="51" y="39" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">03</text>
    <text x="356" y="39" text-anchor="end" class="mono" font-size="10.5" fill="#71717A" letter-spacing="1.4">AUTH · HARDENING</text>

    <text x="28" y="78" class="sans" font-size="20" font-weight="700" fill="#FAFAFA">Base em DevSecOps</text>
    <line x1="28" y1="96" x2="356" y2="96" stroke="#27272A" stroke-width="1"/>

    <text x="28" y="126" class="sans" font-size="13" fill="#D4D4D8">▸ Autenticação Corporativa via LDAP / AD &amp; JWT</text>
    <text x="28" y="156" class="sans" font-size="13" fill="#D4D4D8">▸ Governança de Acesso por Grupos e Perfis (RBAC)</text>
    <text x="28" y="186" class="sans" font-size="13" fill="#A1A1AA">▸ Builds Docker Multi-Stage com Usuário Non-Root</text>
    <text x="28" y="216" class="sans" font-size="13" fill="#A1A1AA">▸ Scan de Imagens em Registry &amp; Proteção de Rotas</text>

    <rect x="24" y="248" width="336" height="42" rx="8" fill="#121216" stroke="#27272A" stroke-width="1"/>
    <text x="40" y="273" class="mono" font-size="10.5" fill="#A1A1AA" letter-spacing="0.8">SECURITY :: SHIFT-LEFT</text>
    <circle class="p2" cx="232" cy="269" r="3.5" fill="#FFFFFF"/>
    <text x="344" y="273" text-anchor="end" class="mono" font-size="10.5" font-weight="700" fill="#FFFFFF">HARDENED</text>
  </g>
</svg>
